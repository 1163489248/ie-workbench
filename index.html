<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>学习工作台导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#0f1525;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{font-size:24px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.subtitle{font-size:14px;color:#94a3b8;margin-bottom:30px}
.cards{display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px}
.card{display:block;text-decoration:none;background:linear-gradient(135deg,#1a2138,#222b48);border:1px solid #2a3556;border-radius:14px;padding:20px;transition:all .25s;cursor:pointer}
.card:hover{transform:translateY(-3px);border-color:#38bdf8;box-shadow:0 8px 24px rgba(56,189,248,.15)}
.card:active{transform:translateY(-1px)}
.card-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.card-icon{font-size:32px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border-radius:12px;flex-shrink:0}
.icon-1{background:rgba(56,189,248,.15)}
.icon-2{background:rgba(129,140,248,.15)}
.icon-3{background:rgba(251,191,36,.15)}
.card-title{font-size:17px;font-weight:700;color:#e2e8f0}
.card-arrow{margin-left:auto;color:#475569;font-size:20px;transition:color .2s}
.card:hover .card-arrow{color:#38bdf8}
.card-desc{font-size:13px;color:#94a3b8;line-height:1.6}
.card-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 10px;border-radius:10px;background:#1e293b;color:#64748b}
.footer{margin-top:30px;font-size:12px;color:#475569}
</style>
</head>
<body>
<h1>📚 学习工作台</h1>
<p class="subtitle">点击卡片进入对应工作台</p>
<div class="cards">
<a class="card" href="ie-knowledge.html">
<div class="card-head">
<div class="card-icon icon-1">⚙️</div>
<div class="card-title">IE工程师知识学习</div>
<div class="card-arrow">›</div>
</div>
<div class="card-desc">IE高频缩写库、公式手册、基础理论、软技能、每日一学</div>
<div class="card-tags"><span class="tag">40+缩写</span><span class="tag">15个公式</span><span class="tag">12个理论</span><span class="tag">10个软技能</span></div>
</a>
<a class="card" href="岗位简历匹配工作台.html">
<div class="card-head">
<div class="card-icon icon-2">💼</div>
<div class="card-title">岗位简历匹配工作台</div>
<div class="card-arrow">›</div>
</div>
<div class="card-desc">BOSS直聘岗位分析与简历匹配，求职利器</div>
<div class="card-tags"><span class="tag">岗位匹配</span><span class="tag">简历分析</span></div>
</a>
<a class="card" href="广东省考公备考指南.html">
<div class="card-head">
<div class="card-icon icon-3">📝</div>
<div class="card-title">广东省考公备考指南</div>
<div class="card-arrow">›</div>
</div>
<div class="card-desc">广东省公务员考试备考资料与学习指南</div>
<div class="card-tags"><span class="tag">考公备考</span><span class="tag">学习指南</span></div>
</a>
</div>
<p class="footer">⭐ 可添加到手机书签/主屏幕，随时访问</p>
</body>
</html>
