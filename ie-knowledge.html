<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IE工程师知识学习工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1525;--card:#1a2138;--card-hover:#222b48;
  --border:#2a3556;--text:#e2e8f0;--text-dim:#94a3b8;
  --accent:#38bdf8;--accent2:#818cf8;--warm:#fbbf24;
  --green:#34d399;--red:#f87171;--pink:#f472b6;
  --tag-bg:#1e293b;
}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}

/* Header */
.header{background:linear-gradient(135deg,#0f1525,#1a2138);border-bottom:1px solid var(--border);padding:16px 20px;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.header-title{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px}
.header-title .icon{font-size:26px}
.header-date{font-size:13px;color:var(--text-dim)}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:500px}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:16px}

/* Nav */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.nav-btn{padding:7px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;color:var(--text-dim);font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-btn:hover{color:var(--text);border-color:var(--accent)}
.nav-btn.active{background:var(--accent);color:#0f1525;border-color:var(--accent);font-weight:600}

/* Daily Learn */
.daily-box{background:linear-gradient(135deg,#1a2138,#222b48);border:1px solid var(--accent);border-radius:12px;padding:16px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.daily-box::before{content:'';position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(56,189,248,.1),transparent);border-radius:50%}
.daily-label{font-size:12px;color:var(--warm);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.daily-title{font-size:17px;font-weight:700;margin-bottom:6px;color:var(--accent)}
.daily-content{font-size:14px;color:var(--text-dim);line-height:1.7}
.daily-content b{color:var(--text)}
.daily-formula{background:rgba(56,189,248,.08);border-left:3px solid var(--accent);padding:8px 12px;margin-top:8px;border-radius:0 6px 6px 0;font-family:'Courier New',monospace;font-size:14px;color:var(--accent)}
.daily-nav{display:flex;gap:8px;margin-top:10px}
.daily-nav button{padding:4px 12px;background:var(--tag-bg);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:12px;cursor:pointer;transition:all .2s}
.daily-nav button:hover{color:var(--accent);border-color:var(--accent)}

/* Content */
.content{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.section-title{font-size:16px;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:8px;color:var(--accent2)}
.section-title .count{font-size:12px;color:var(--text-dim);font-weight:400;background:var(--tag-bg);padding:2px 8px;border-radius:10px}

/* Cards Grid */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:all .2s;cursor:pointer}
.card:hover{background:var(--card-hover);border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-abbr{font-size:18px;font-weight:700;color:var(--accent)}
.card-full{font-size:12px;color:var(--text-dim);font-style:italic}
.card-tag{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tag-设备{background:rgba(52,211,153,.15);color:var(--green)}
.tag-精益{background:rgba(129,140,248,.15);color:var(--accent2)}
.tag-质量{background:rgba(251,191,36,.15);color:var(--warm)}
.tag-生产{background:rgba(56,189,248,.15);color:var(--accent)}
.tag-方法{background:rgba(244,114,182,.15);color:var(--pink)}
.tag-通用{background:rgba(148,163,184,.15);color:var(--text-dim)}
.tag-管理{background:rgba(129,140,248,.15);color:var(--accent2)}
.tag-沟通{background:rgba(251,191,36,.15);color:var(--warm)}
.tag-思维{background:rgba(52,211,153,.15);color:var(--green)}
.tag-时间{background:rgba(56,189,248,.15);color:var(--accent)}
.card-cn{font-size:14px;font-weight:600;margin-bottom:4px}
.card-desc{font-size:13px;color:var(--text-dim);line-height:1.6}
.card-formula{background:rgba(56,189,248,.06);border-left:3px solid var(--accent2);padding:6px 10px;margin-top:8px;border-radius:0 6px 6px 0;font-family:'Courier New',monospace;font-size:13px;color:var(--accent2)}
.card-example{font-size:12px;color:var(--green);margin-top:4px}

/* Theory Cards */
.theory-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;transition:all .2s}
.theory-card:hover{background:var(--card-hover);border-color:var(--accent2)}
.theory-card h3{font-size:15px;color:var(--accent2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.theory-card .t-desc{font-size:13px;color:var(--text-dim);margin-bottom:8px}
.theory-card ul{list-style:none;padding-left:0}
.theory-card li{font-size:13px;color:var(--text);padding:3px 0 3px 16px;position:relative}
.theory-card li::before{content:'▸';position:absolute;left:0;color:var(--accent)}

/* Soft Skill Cards */
.soft-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;transition:all .2s}
.soft-card:hover{background:var(--card-hover);border-color:var(--warm)}
.soft-card h3{font-size:15px;color:var(--warm);margin-bottom:8px}
.soft-card .s-desc{font-size:13px;color:var(--text-dim);margin-bottom:8px}
.soft-tips{display:flex;flex-wrap:wrap;gap:6px}
.soft-tip{font-size:12px;background:var(--tag-bg);border:1px solid var(--border);padding:3px 10px;border-radius:6px;color:var(--text-dim)}

/* No Result */
.no-result{text-align:center;padding:40px;color:var(--text-dim);font-size:15px}

/* Responsive */
@media(max-width:680px){
  .card-grid{grid-template-columns:1fr}
  .header-title{font-size:17px}
  .daily-title{font-size:15px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title"><span class="icon">⚙️</span>IE工程师知识学习工作台</div>
    <div class="search-wrap">
      <span class="si">🔍</span>
      <input type="search" id="searchBox" placeholder="搜索缩写、术语、公式…">
    </div>
    <div class="header-date" id="todayDate"></div>
  </div>
  <div class="nav" id="navBar">
    <button class="nav-btn active" data-cat="all">📚 全部</button>
    <button class="nav-btn" data-cat="essential">🧭 IE必学</button>
    <button class="nav-btn" data-cat="abbr">🔤 IE缩写库</button>
    <button class="nav-btn" data-cat="formula">📐 公式手册</button>
    <button class="nav-btn" data-cat="theory">🎓 基础理论</button>
    <button class="nav-btn" data-cat="job">💼 招聘技能地图</button>
    <button class="nav-btn" data-cat="digital">🖥️ 数字化技能</button>
    <button class="nav-btn" data-cat="soft">🤝 软技能</button>
  </div>
</div>

<div class="content">
  <div class="daily-box" id="dailyBox"></div>
  <div id="mainContent"></div>
</div>

<script>
// ============ 知识库 ============
const ABBR = [
  {abbr:"OEE",full:"Overall Equipment Effectiveness",cn:"设备综合效率",cat:"设备",desc:"衡量设备在计划运行时间内实际发挥了多少有效产出的综合指标，是TPM核心指标。",formula:"OEE = 可用率 × 性能率 × 良品率",example:"可用率90%×性能率95%×良品率99% = 84.6%"},
  {abbr:"CT",full:"Cycle Time",cn:"周期时间",cat:"设备",desc:"完成一个工序循环所需的时间，从开始到下一次开始的时间间隔。",formula:"CT = 单个循环完成时间",example:"机器每45秒产出一个零件，CT=45s"},
  {abbr:"TT",full:"Takt Time",cn:"节拍时间",cat:"生产",desc:"根据客户需求速率计算的生产节奏，是流水线设计的基准。",formula:"TT = 可用工作时间 / 客户需求量",example:"480min/日 ÷ 480件/日 = 1min/件"},
  {abbr:"WIP",full:"Work In Process",cn:"在制品",cat:"生产",desc:"生产过程中正在加工或等待加工的半成品，过多WIP掩盖问题。",formula:"WIP = 吞吐率 × 流转时间（利特尔法则）",example:"10件/小时 × 3小时 = 30件"},
  {abbr:"SOP",full:"Standard Operating Procedure",cn:"标准作业指导书",cn2:"标准操作程序",cat:"方法",desc:"以文件形式描述的标准操作步骤，确保作业一致性，是IE基础工具。",formula:"无",example:"装配工序SOP包含工步图+时间+注意事项"},
  {abbr:"JIT",full:"Just In Time",cn:"准时制生产",cat:"精益",desc:"在需要的时候按需要的量生产所需的产品，消除库存浪费。丰田生产方式核心。",formula:"无",example:"按订单拉动生产，不做过量库存"},
  {abbr:"TPM",full:"Total Productive Maintenance",cn:"全员生产维护",cat:"设备",desc:"通过全员参与的设备维护活动，追求设备零故障、零不良。",formula:"无",example:"操作工日常点检+维修工定期保养"},
  {abbr:"SMED",full:"Single Minute Exchange of Die",cn:"快速换模法",cat:"精益",desc:"将换模时间压缩到10分钟以内的方法，区分内部作业与外部作业是核心。",formula:"换模时间 = 内部作业时间（停机时）",example:"模具预热在机外完成=外部作业"},
  {abbr:"VSM",full:"Value Stream Mapping",cn:"价值流图",cat:"精益",desc:"可视化从原材料到交付客户的全部物流和信息流，识别浪费。",formula:"增值比 = 增值时间 / 总前置时间 × 100%",example:"总前置时间20天，增值时间2小时→增值比0.4%"},
  {abbr:"ECRS",full:"Eliminate-Combine-Rearrange-Simplify",cn:"取消-合并-重排-简化",cat:"方法",desc:"IE四大原则，用于方法改善和动作优化，优先取消不必要的作业。",formula:"无",example:"取消多余搬运→合并检验工序→重排工位顺序→简化操作动作"},
  {abbr:"PDCA",full:"Plan-Do-Check-Act",cn:"戴明环/持续改进循环",cat:"管理",desc:"计划-执行-检查-处理的持续改进循环，是所有改善活动的基本框架。",formula:"无",example:"制定改善方案→试运行→验证效果→标准化推广"},
  {abbr:"5S",full:"Seiri-Seiton-Seiso-Seiketsu-Shitsuke",cn:"整理-整顿-清扫-清洁-素养",cat:"精益",desc:"现场管理基础方法，从整理物品到养成习惯的五步法。",formula:"无",example:"整理：区分要与不要；整顿：定位定量"},
  {abbr:"BOM",full:"Bill of Materials",cn:"物料清单",cat:"生产",desc:"产品所需全部零部件及数量的清单，是MRP/ERP系统的基础数据。",formula:"无",example:"成品A由2个B+1个C组成→BOM: B×2, C×1"},
  {abbr:"ERP",full:"Enterprise Resource Planning",cn:"企业资源计划",cat:"管理",desc:"整合企业各业务环节的信息化系统，实现资源优化配置。",formula:"无",example:"SAP、用友、金蝶等系统"},
  {abbr:"MRP",full:"Material Requirements Planning",cn:"物料需求计划",cat:"生产",desc:"根据主生产计划和BOM，计算各层级物料的需求量和需求时间。",formula:"净需求 = 毛需求 - 可用库存 + 安全库存",example:"订单需100件，库存30件→净需求70件"},
  {abbr:"KPI",full:"Key Performance Indicator",cn:"关键绩效指标",cat:"管理",desc:"衡量组织或个人绩效达成情况的核心量化指标。",formula:"无",example:"稼动率≥85%、人均产量≥500件/班"},
  {abbr:"Kaizen",full:"改善（日语）",cn:"持续改善",cat:"精益",desc:"丰田生产方式核心理念，强调全员参与、小步快跑的持续改进。",formula:"无",example:"每日改善提案、月度改善发表会"},
  {abbr:"Kanban",full:"看板（日语）",cn:"拉动式生产信号",cat:"精益",desc:"用卡片或容器作为生产/搬运指令的拉动系统工具，控制WIP。",formula:"看板数量 = (日需求×前置时间×安全系数) / 容器容量",example:"日需100件，前置2天，安全0.2，容器10件→(100×2×1.2)/10=24张"},
  {abbr:"Poka-Yoke",full:"防错法（日语）",cn:"防呆/防错",cat:"质量",desc:"通过设计使得错误无法发生或一旦发生立即被发现。",formula:"无",example:"USB接口防反插设计、缺件传感器报警"},
  {abbr:"MTM",full:"Methods-Time Measurement",cn:"方法时间测量法",cat:"方法",desc:"预定动作时间系统，将基本动作赋以标准时间值，用于设定标准工时。",formula:"标准时间 = Σ(基本动作时间) × 评比 × 宽放",example:"伸手30cm=MTM值10.1TMU"},
  {abbr:"MOD",full:"Modular Arrangement of Predetermined Time Standard",cn:"模特排时法",cat:"方法",desc:"以手指动作(2.5cm)为1MOD的基本动作时间系统，简化版MTM。",formula:"1 MOD = 0.129秒（普通速度）",example:"伸手抓取=3MOD，移动放置=4MOD"},
  {abbr:"SPC",full:"Statistical Process Control",cn:"统计过程控制",cat:"质量",desc:"用控制图等统计方法监控过程稳定性，区分普通原因和特殊原因变异。",formula:"控制限 = 均值 ± 3σ",example:"UCL=μ+3σ, LCL=μ-3σ"},
  {abbr:"CPK",full:"Process Capability Index",cn:"过程能力指数",cat:"质量",desc:"衡量过程在满足规格要求方面的能力，考虑偏移情况。",formula:"CPK = min[(USL-μ),(μ-LSL)] / (3σ)",example:"USL=10.5, LSL=9.5, μ=10.1, σ=0.1→CPK=1.33"},
  {abbr:"DMAIC",full:"Define-Measure-Analyze-Improve-Control",cn:"六西格玛改进五步法",cat:"质量",desc:"六西格玛项目标准流程：定义-测量-分析-改进-控制。",formula:"无",example:"定义缺陷→测量现状→分析根因→改进方案→控制标准化"},
  {abbr:"FMEA",full:"Failure Mode and Effects Analysis",cn:"失效模式与影响分析",cat:"质量",desc:"系统分析潜在失效模式及其影响，评估风险优先数。",formula:"RPN = 严重度(S) × 发生度(O) × 探测度(D)",example:"S=8, O=4, D=3 → RPN=96（需改善）"},
  {abbr:"TOC",full:"Theory of Constraints",cn:"约束理论",cat:"管理",desc:"通过识别和突破系统瓶颈来提升整体产出的管理哲学。",formula:"产出 = 通过瓶颈的最大速率",example:"瓶颈工序10件/h→全厂产出≤10件/h"},
  {abbr:"FIFO",full:"First In First Out",cn:"先进先出",cat:"生产",desc:"物料按入库顺序出库，防止积压和过期。",formula:"无",example:"仓库通道设计为单向，先入库先出库"},
  {abbr:"ANDON",full:"安灯（日语）",cn:"安灯系统/呼叫系统",cat:"设备",desc:"生产现场异常呼叫与可视化管理系统，任何人都可拉绳停线。",formula:"无",example:"发现异常→拉安灯→班长响应→2分钟未解决停线"},
  {abbr:"Gemba",full:"现场（日语）",cn:"现场现物",cat:"精益",desc:"强调到生产现场观察实际情况，基于事实做决策。",formula:"无",example:"现场现物现实的三现主义"},
  {abbr:"Jidoka",full:"自働化（日语）",cn:"智能自动化/带人字旁的自动化",cat:"精益",desc:"设备异常时自动停机，将人的智能赋予机器，实现品质内建。",formula:"无",example:"断线传感器检测到断线→自动停机→安灯报警"},
  {abbr:"Heijunka",full:"平准化（日语）",cn:"生产平准化",cat:"精益",desc:"将不同产品品种和数量均匀分配到各时间段，减少波动。",formula:"无",example:"ABC三种产品按A-B-C-A-B-C顺序均衡生产"},
  {abbr:"Muda",full:"浪费（日语）",cn:"七大浪费",cat:"精益",desc:"不增加价值的活动：过量生产、等待、搬运、加工、库存、动作、不良。",formula:"无",example:"过量生产=制造过多；等待=人等机器"},
  {abbr:"QCO",full:"Quick Changeover",cn:"快速切换",cat:"精益",desc:"SMED的扩展应用，不仅模具切换，包括产品换型、工装调整等。",formula:"切换时间 = 内部切换时间（停机）",example:"换产品型号时停机时间从40min降至8min"},
  {abbr:"PPH",full:"Parts Per Hour",cn:"每小时产量",cat:"生产",desc:"衡量生产效率的常用指标，人均或机均每小时产出。",formula:"PPH = 总产量 / (人数 × 工作小时)",example:"800件 / (2人×8h) = 50 PPH/人"},
  {abbr:"UPPH",full:"Units Per Person Hour",cn:"人均时产",cat:"生产",desc:"单位人时的产出量，是劳动效率的核心指标。",formula:"UPPH = 总产量 / 总人工工时",example:"1000件 / 16工时 = 62.5 UPPH"},
  {abbr:"FPY",full:"First Pass Yield",cn:"直通率/一次合格率",cat:"质量",desc:"产品第一次通过检验的合格率，不包含返工返修。",formula:"FPY = 一次合格数 / 投入总数 × 100%",example:"投入1000件，一次合格950件→FPY=95%"},
  {abbr:"DTD",full:"Dock to Dock",cn:"入库到出库时间",cat:"精益",desc:"从原材料入库到成品出库的总时间，衡量物流效率。",formula:"DTD = 原材料库存天数 + 生产周期 + 成品库存天数",example:"原料3天+生产2天+成品5天=DTD 10天"},
  {abbr:"WBS",full:"Work Breakdown Structure",cn:"工作分解结构",cat:"管理",desc:"将项目逐层分解为可管理的工作包，用于项目计划和控制。",formula:"无",example:"新产品导入项目→设计/试产/量产三大模块→各模块细分任务"},
  {abbr:"ROI",full:"Return on Investment",cn:"投资回报率",cat:"管理",desc:"投资收益与投资成本的比率，用于评估改善方案的经济性。",formula:"ROI = (收益 - 投资成本) / 投资成本 × 100%",example:"投入10万，年节约15万→ROI=(15-10)/10=50%"},
  {abbr:"PMP",full:"Project Management Professional",cn:"项目管理专业人士",cat:"管理",desc:"国际认证的项目管理知识体系，包含五大过程组和十大知识领域。",formula:"无",example:"启动→规划→执行→监控→收尾"},
  {abbr:"MES",full:"Manufacturing Execution System",cn:"制造执行系统",cat:"管理",desc:"连接ERP与车间控制层的执行系统，管理工单、报工、追溯、质量数据。",formula:"无",example:"MES扫码报工，任务绩效自动核算"},
  {abbr:"WMS",full:"Warehouse Management System",cn:"仓储管理系统",cat:"管理",desc:"管理库位、批次、出入库作业和库存盘点的系统，是仓库数字化的核心。",formula:"无",example:"RFID扫码入库、库位自动分配、库龄自动统计"},
  {abbr:"APS",full:"Advanced Planning and Scheduling",cn:"高级计划与排程",cat:"生产",desc:"考虑物料、产能、换型时间等约束，自动生成最优排产计划的系统。",formula:"无",example:"换型时间最短化排产，减少洗机损失"},
  {abbr:"MPS",full:"Master Production Schedule",cn:"主生产计划",cat:"生产",desc:"确定最终产品在具体时段内的产出计划，是MRP的输入。",formula:"无",example:"月度MPS分解为周计划，驱动物料采购"},
  {abbr:"S&OP",full:"Sales and Operations Planning",cn:"销售与运营计划",cat:"管理",desc:"平衡需求与供应的中长期决策流程，通常按月滚动召开会议对齐。",formula:"无",example:"月度S&OP会议对齐销售预测与产能"},
  {abbr:"TPS",full:"Toyota Production System",cn:"丰田生产方式",cat:"精益",desc:"精益生产的源头体系，两大支柱：JIT准时制+自働化(Jidoka)。",formula:"无",example:"看板拉动+安灯停线+标准作业"},
  {abbr:"QCC",full:"Quality Control Circle",cn:"品管圈/品质圈",cat:"质量",desc:"一线员工自发组成的小组，围绕现场问题开展持续改善活动。",formula:"无",example:"圈长带6人小组，3个月降低不良率20%"},
  {abbr:"RTY",full:"Rolled Throughput Yield",cn:"滚动直通率",cat:"质量",desc:"各工序一次合格率的连乘积，反映全流程质量真实水平。",formula:"RTY = FPY₁ × FPY₂ × … × FPYₙ",example:"三道工序各98% → RTY=0.98³=94.1%"},
  {abbr:"NPI",full:"New Product Introduction",cn:"新产品导入",cat:"管理",desc:"从设计验证到量产爬坡的完整流程，IE负责工时/线体/SOP。",formula:"无",example:"EVT→DVT→PVT→MP四阶段"},
  {abbr:"OPE",full:"Overall Personnel Effectiveness",cn:"人员综合效率",cat:"生产",desc:"仿照OEE衡量人员效率：可用率×直接作业率×绩效率。",formula:"OPE = 可用率 × 作业率 × 绩效率",example:"出勤95%×直接作业85%×绩效110% → OPE=88.8%"},
  {abbr:"PLM",full:"Product Lifecycle Management",cn:"产品生命周期管理",cat:"管理",desc:"管理产品从概念设计、工艺、制造到退市全过程数据的信息系统，与ERP/MES打通设计到生产的数据链。",formula:"PLM贯穿：需求→设计→工艺→制造→服务→退市",example:"新产品NPI时，PLM里的BOM和工艺路线直接下发给MES生产"},
  {abbr:"PDA",full:"Personal Digital Assistant",cn:"手持数据终端",cat:"管理",desc:"车间常用的手持扫码终端，用于任务报工、扫码计数、移库确认等现场数据采集。",formula:"PDA扫码 → 实时写入MES → 形成任务/绩效记录",example:"收卷工用PDA扫收卷任务码，系统即记录包数与时间"},
  {abbr:"RFID",full:"Radio Frequency Identification",cn:"射频识别",cat:"管理",desc:"非接触式自动识别技术，标签贴于物料/托板/周转箱，读取速度快、可批量识别，是WMS数字化基础。",formula:"RFID读写器 → 批量读取标签 → 库存自动更新",example:"叉车带RFID读取器过库门，整托原料自动入库记账"},
  {abbr:"AGV",full:"Automated Guided Vehicle",cn:"自动导引运输车",cat:"设备",desc:"沿预定路径自动行驶的搬运设备，替代重复性人力搬运，是智能物流的核心载体。",formula:"AGV台数 = 总搬运任务量 ÷ (单台运载量 × 日运行趟数)",example:"原料仓用3台AGV替代2名搬运工，实现24h不间断供料"},
  {abbr:"IIoT",full:"Industrial Internet of Things",cn:"工业物联网",cat:"设备",desc:"把设备、传感器、仪表联网采集数据的技术基础，是OEE自动采集与设备数字化的前提。",formula:"IIoT = 传感器采集 + 网络传输 + 平台分析",example:"注塑机联网后，稼动率/停机时长自动上报，无需人工记录"},
  {abbr:"SRM",full:"Supplier Relationship Management",cn:"供应商关系管理",cat:"管理",desc:"管理供应商准入、评估、绩效与协同的系统，与采购/质量联动。",formula:"供应商评分 = 质量得分 × 权重 + 交期得分 × 权重 + 价格得分 × 权重",example:"月度供应商评分卡：来料合格率、准时交付率、配合度三项加权"},
  {abbr:"CRM",full:"Customer Relationship Management",cn:"客户关系管理",cat:"管理",desc:"管理客户信息、订单、服务的系统，IE视角关注订单到交付的流程效率。",formula:"CRM ↔ ERP：订单信息流从CRM流入ERP排产",example:"客户下单→CRM录入→ERP生成生产订单→排产"},
  {abbr:"VAVE",full:"Value Analysis / Value Engineering",cn:"价值分析/价值工程",cat:"方法",desc:"以功能为核心，用最低成本实现必要功能的方法，是降本改善的经典工具。",formula:"价值 V = 功能 F ÷ 成本 C；提高V的路径：功能不变降成本、成本不变提功能",example:"某零件改用免喷涂材质，功能不变成本降15%，V值提升"},
  {abbr:"LCC",full:"Life Cycle Cost",cn:"全生命周期成本",cat:"管理",desc:"设备/产品从采购、使用、维护到报废的总成本，指导设备选型与投资决策。",formula:"LCC = 采购成本 + 运行能耗 + 维护费用 + 停机损失 + 残值(-)",example:"A设备便宜5万但年电费多3万，3年LCC反而更高，选B更划算"},
  {abbr:"EBITDA",full:"Earnings Before Interest, Taxes, Depreciation and Amortization",cn:"息税折旧摊销前利润",cat:"管理",desc:"衡量企业经营现金创造能力的核心财务指标，IE改善对它的贡献体现在成本节省上。",formula:"EBITDA = 净利润 + 利息 + 所得税 + 折旧 + 摊销",example:"IE改善降低单件工时0.5min，年省人工成本约XX万元，直接增厚EBITDA"},
  {abbr:"NPV",full:"Net Present Value",cn:"净现值",cat:"管理",desc:"项目投资决策指标，把未来现金流按折现率折算到当前时点，NPV>0才值得投资。",formula:"NPV = Σ(第t年现金流 ÷ (1+折现率)^t) − 初始投资",example:"产线自动化投资300万，5年净收益420万，NPV>0，项目可行"},
  {abbr:"COPQ",full:"Cost of Poor Quality",cn:"质量不良成本",cat:"质量",desc:"因质量不良产生的全部成本，含内部失败（返工/报废）与外部失败（客诉/退货）。",formula:"COPQ = 报废 + 返工 + 复检 + 退货 + 客诉处理 + 质量过剩",example:"月报废损失8万+返工工时3万=COPQ 11万，占产值3%"},
  {abbr:"COGS",full:"Cost of Goods Sold",cn:"销货成本",cat:"管理",desc:"已售产品的直接成本，含材料、直接人工、制造费用，是单位成本与毛利计算的基础。",formula:"毛利 = 销售额 − COGS；毛利率 = 毛利 ÷ 销售额",example:"单件COGS 42元，售价58元，毛利率27.6%"},
  {abbr:"MOQ",full:"Minimum Order Quantity",cn:"最小起订量",cat:"生产",desc:"供应商或产线愿意接受的最小订单量，影响备料批量与换型频次。",formula:"经济批量权衡：批量大→换型少但库存高；批量小→库存低但换型多",example:"某原料MOQ 2吨，低于2吨需付调机费，故常凑单采购"},
  {abbr:"LT",full:"Lead Time",cn:"前置期/交付周期",cat:"生产",desc:"从下单到交付的全过程时间，含等待、排队、加工、搬运等，是精益改善的重点压缩对象。",formula:"LT = 加工时间 + 等待时间 + 搬运时间 + 检验时间",example:"订单LT 15天，其中实际加工仅2天，13天是等待与排队"},
  {abbr:"CR",full:"Capacity Requirement",cn:"产能需求",cat:"生产",desc:"满足生产计划所需的资源能力，与可用产能对比得出负荷率。",formula:"负荷率 = 需求产能 ÷ 可用产能 × 100%；>100%为产能不足",example:"月需求1200h，可用产能1000h，负荷率120%，需加班或外协"},
  {abbr:"RCCP",full:"Rough-Cut Capacity Planning",cn:"粗能力计划",cat:"生产",desc:"对关键资源（瓶颈设备/人力）做粗略的能力校验，快速判断主计划是否可行。",formula:"RCCP校验对象 = 瓶颈工序；方法 = 负荷对比总能力",example:"排产前先看注塑机总负荷，超100%就调整交期"},
  {abbr:"MTO",full:"Make To Order",cn:"按订单生产",cat:"生产",desc:"接到订单才投产的模式，库存低但交期长，与MTS（备货生产）相对应。",formula:"MTO：订单驱动；MTS：预测驱动，备库存应对交期",example:"定制设备按MTO，标准螺栓按MTS常备库存"},
  {abbr:"MTS",full:"Make To Stock",cn:"备货生产",cat:"生产",desc:"按预测提前生产入库、客户直接提货的模式，交期短但库存风险高。",formula:"MTS安全库存 = 日均用量 × 补货周期 × 安全系数",example:"包装袋按MTS生产，客户下单当日即可发货"},
  {abbr:"OEM",full:"Original Equipment Manufacturer",cn:"原始设备制造商/代工",cat:"管理",desc:"按品牌方要求生产、贴对方品牌的企业模式，与ODM（含设计）区分。",formula:"OEM：只代工；ODM：代工+设计；OBM：自有品牌",example:"公司为国际品牌代工包装材料，属OEM模式"},
  {abbr:"ODM",full:"Original Design Manufacturer",cn:"原始设计制造商",cat:"管理",desc:"既代工又参与设计的制造模式，附加值高于纯代工。",formula:"ODM = OEM + 设计能力",example:"客户提需求，公司设计方案并生产，属ODM"},
  {abbr:"VSM 现状/未来",full:"Current / Future State Map",cn:"现状图与未来图",cat:"精益",desc:"VSM实施的两张核心图：现状图记录真实物流信息流，未来图描绘改善后的目标状态。",formula:"改善路径 = 未来图 − 现状图",example:"现状图显示总LT 12天、增值时间仅25min，未来图目标LT 5天"},
  {abbr:"TPS 两大支柱",full:"Just-In-Time & Jidoka",cn:"准时化与自働化",cat:"精益",desc:"丰田生产方式的两大支柱：JIT（在需要时按需要量生产）与自働化（异常自动停止）。",formula:"TPS = JIT + Jidoka + 持续改善",example:"安灯拉绳停线即自働化；看板拉动即JIT"},
  {abbr:"A3",full:"A3 Report",cn:"A3报告",cat:"精益",desc:"用一张A3纸完整呈现问题、分析、对策、计划的结构化问题解决方法，源自丰田。",formula:"左半边=现状与目标；右半边=对策与计划",example:"改善项目用A3汇报：背景→现状→目标→原因→对策→计划"},
  {abbr:"5Why",full:"5 Whys",cn:"五问法",cat:"方法",desc:"通过连续追问「为什么」追溯问题根本原因的分析方法，是精益问题解决的入门工具。",formula:"现象 → 为什么×5 → 根本原因",example:"地面有油→为什么漏油→垫圈老化→为什么老化→未定期更换→无点检标准"},
  {abbr:"4M1E",full:"Man/Machine/Material/Method/Environment",cn:"人机料法环",cat:"方法",desc:"现场问题的五大要素分类框架，用于系统性排查原因（常与鱼骨图配合）。",formula:"4M1E = 人(Man) + 机(Machine) + 料(Material) + 法(Method) + 环(Environment)",example:"不良分析先按4M1E分类排查，再逐项验证"},
  {abbr:"KPI/OKR",full:"Key Performance Indicator / Objectives and Key Results",cn:"关键指标/目标与关键成果",cat:"管理",desc:"KPI是考核指标，OKR是目标管理法；IE改善目标常同时用两者设定。",formula:"OKR：Objective（定性目标）+ KR（可量化关键结果）",example:"O：降低单件工时；KR1：单件工时从8min降至6.5min；KR2：UPPH提升20%"},
  {abbr:"SQDCME",full:"Safety/Quality/Delivery/Cost/Morale/Environment",cn:"安全质量交付成本士气环境",cat:"管理",desc:"现场管理六大维度考核框架，源自精益管理的绩效仪表盘，用于看板设计。",formula:"SQDCME = 安全 + 质量 + 交付 + 成本 + 士气 + 环境",example:"车间看板按SQDCME六格展示每日绩效，一眼看全"},
  {abbr:"PDCA/4P",full:"Plan-Do-Check-Act",cn:"计划-执行-检查-处理",cat:"管理",desc:"戴明环的具体展开，PDCA循环是持续改善的通用方法论，与SDCA（标准化）配合。",formula:"PDCA改善 → SDCA维持 → 再PDCA改善（螺旋上升）",example:"改善后把新方法写进SOP（SDCA），再找下一轮改善点（PDCA）"},
  {abbr:"OJT",full:"On the Job Training",cn:"在岗培训",cat:"管理",desc:"在实际工作岗位上边做边学的培训方式，是技能矩阵与多能工培养的主要手段。",formula:"技能矩阵：横轴=员工；纵轴=岗位技能；打勾表示已掌握",example:"用技能矩阵管理班组，多能工比例从30%提到60%"},
  {abbr:"TWI",full:"Training Within Industry",cn:"产业内训练",cat:"管理",desc:"源自二战美国的督导者培训体系，含JI工作指导、JM工作改善、JR工作关系、JS工作安全。",formula:"TWI四大模块：JI + JM + JR + JS",example:"班组长用TWI-JI的方法教新人操作，缩短上手时间"},
  {abbr:"MSA",full:"Measurement System Analysis",cn:"测量系统分析",cat:"质量",desc:"评估测量系统（量具+人+方法）的波动是否可接受，测量不准则一切分析失真。",formula:"GR&R% = 测量系统波动 ÷ 总波动 × 100%；<10%可接受，>30%不合格",example:"两个检验员测同一批料结果差很多，做GR&R发现评价者变异过大"},
  {abbr:"PPAP",full:"Production Part Approval Process",cn:"生产件批准程序",cat:"质量",desc:"汽车行业新产品量产前的批准流程，需提交样品、检测报告、过程能力等成套文件。",formula:"PPAP 18项文件，提交等级1~5",example:"新客户新料号量产前须提交PPAP并拿到客户批准PSW"},
  {abbr:"APQP",full:"Advanced Product Quality Planning",cn:"先期产品质量策划",cat:"质量",desc:"产品开发阶段的质量策划框架，五阶段贯穿从立项到量产，与PPAP/FMEA/SPC构成体系。",formula:"APQP五阶段：策划→设计→过程设计→确认→量产反馈",example:"新项目启动即按APQP排计划，各阶段有交付物与评审节点"},
  {abbr:"CTQ",full:"Critical To Quality",cn:"关键质量特性",cat:"质量",desc:"从客户需求转化而来的、必须满足的关键质量参数，是六西格玛项目聚焦对象。",formula:"客户需求 → CTQ → 可测量指标（CTQ树）",example:"客户要求「不掉带」（需求）→ CTQ：拉伸强度≥XX MPa（可测）"},
  {abbr:"DPMO",full:"Defects Per Million Opportunities",cn:"百万机会缺陷数",cat:"质量",desc:"六西格玛通用不良率指标，把不同复杂度的过程归一化到同一尺度比较。",formula:"DPMO = 缺陷数 ÷ (总机会数 × 单位数) × 1,000,000",example:"DPMO 3.4 = 6σ水平（每百万次机会仅3.4个缺陷）"},
  {abbr:"COQ",full:"Cost of Quality",cn:"质量成本",cat:"质量",desc:"质量相关成本总称，含预防成本、鉴定成本、内部失败成本、外部失败成本四类。",formula:"COQ = 预防 + 鉴定 + 内部失败 + 外部失败",example:"增加预防投入（培训/防呆）可大幅降低失败成本，总COQ反降"},
  {abbr:"OOT",full:"Out of Tolerance",cn:"超差",cat:"质量",desc:"测量值超出规格公差范围的情况，与OOS（超出规范）区分，OOT常作趋势预警。",formula:"OOT：超出公差中心带；OOS：超出规格上下限",example:"检测值虽在规格内但已偏离目标值，标OOT提前预警"},
  {abbr:"QMS",full:"Quality Management System",cn:"质量管理体系",cat:"质量",desc:"企业为保证质量建立的组织、流程、文件体系，如ISO9001/IATF16949。",formula:"QMS = 质量方针 + 过程管理 + 文件化 + 持续改进",example:"ISO9001体系文件含质量手册、程序文件、作业指导书、记录"},
  {abbr:"8D",full:"Eight Disciplines",cn:"八步法",cat:"质量",desc:"团队解决客户投诉/重大质量问题的标准流程，从组建团队到预防再发共八步。",formula:"D1组队→D2描述→D3临时对策→D4根因→D5永久对策→D6验证→D7预防→D8总结",example:"客诉断带问题按8D分析，根因是原料批次波动，出台来料检验加严标准"},
  {abbr:"MTBF",full:"Mean Time Between Failures",cn:"平均故障间隔时间",cat:"设备",desc:"设备两次故障之间的平均运行时间，反映可靠性水平，越高越好。",formula:"MTBF = 总运行时间 ÷ 故障次数",example:"设备运行3000h故障3次，MTBF=1000h"},
  {abbr:"MTTR",full:"Mean Time To Repair",cn:"平均修复时间",cat:"设备",desc:"从故障发生到恢复可用的平均耗时，反映维修效率，越低越好。",formula:"MTTR = 总维修时间 ÷ 故障次数",example:"本月故障总维修9h共6次，MTTR=1.5h"},
  {abbr:"PM",full:"Preventive Maintenance",cn:"预防性维护",cat:"设备",desc:"按计划定期执行的保养维护，防止故障发生，区别于故障后才做的BM（事后维修）。",formula:"PM周期 = 依据厂家建议 + 历史故障数据 + 设备重要性",example:"关键设备每月PM一次，更换易损件，避免突发停机"},
  {abbr:"CMMS",full:"Computerized Maintenance Management System",cn:"计算机化维护管理系统",cat:"设备",desc:"管理设备台账、维修工单、备件库存、维护计划的系统，是设备数字化的基础。",formula:"CMMS功能：设备档案 + 工单管理 + 备件库存 + 维护计划 + 报表",example:"维修工单在CMMS里派发与闭环，停机时长自动统计"},

  {title:"OEE的三个乘数",content:"OEE = <b>可用率</b> × <b>性能率</b> × <b>良品率</b>。可用率关注设备是否在运行，性能率关注运行速度是否达标，良品率关注产出的产品是否合格。三者相乘才是真实的设备效率。世界级标准≥85%。",formula:"OEE = 可用率 × 性能率 × 良品率"},
  {title:"节拍时间 vs 周期时间",content:"<b>节拍时间(TT)</b>是客户需求的速率：可用时间÷需求量。<b>周期时间(CT)</b>是实际完成一个循环的时间。理想状态下 CT ≤ TT。当 CT > TT 时，产能不能满足需求，需要改善瓶颈。",formula:"TT = 可用工作时间 / 客户需求量"},
  {title:"ECRS四大原则",content:"改善作业时的优先顺序：<b>取消(E)</b>→<b>合并(C)</b>→<b>重排(R)</b>→<b>简化(S)</b>。第一步永远是问'能不能不做'，其次才考虑合并和重排，最后才是简化。取消是最高效的改善。",formula:"E > C > R > S"},
  {title:"七大浪费识别",content:"过量生产（做得太多太早）、等待（人等机器/机器等人）、搬运（不必要的移动）、加工（过度的加工要求）、库存（掩盖问题的库存）、动作（不必要的身体动作）、不良（返工返修）。过量生产是万恶之源。",formula:"浪费 = 不增值活动"},
  {title:"SMED核心思想",content:"快速换模的核心是区分<b>内部作业</b>（停机才能做）和<b>外部作业</b>（不停机也能做），然后将内部作业转化为外部作业。比如模具预热、工具准备都可以在停机前完成。",formula:"换模时间↓ = 内部作业时间↓"},
  {title:"利特尔法则",content:"<b>WIP = 吞吐率 × 流转时间</b>。这个公式说明：在产出速率不变的情况下，减少在制品就能缩短流转时间。这就是精益生产追求'单件流'的数学基础。",formula:"WIP = TH × CT"},
  {title:"标准工时构成",content:"标准工时 = <b>观测时间</b> × <b>评比系数</b> × <1 + <b>宽放率</b>)。评比系数修正操作者速度差异（正常=1.0）；宽放率含私事(5%)+疲劳(5-10%)+延迟(3-5%)，确保工时公平可行。",formula:"ST = OT × R × (1+A)"},
  {title:"CPK与过程能力",content:"CPK衡量过程能否满足规格要求。CPK≥1.33为可接受，≥1.67为优秀。它考虑了过程均值偏移的影响，比CP（仅考虑分散度）更严格。六西格玛水平对应CPK≥2.0。",formula:"CPK = min[(USL-μ),(μ-LSL)] / (3σ)"},
  {title:"5W1H提问法",content:"对每个工序/动作连续追问：<b>What</b>做什么？<b>Why</b>为什么做？<b>Where</b>在哪做？<b>When</b>何时做？<b>Who</b>谁来做？<b>How</b>怎么做？配合ECRS原则，是发现改善点的利器。",formula:"5W1H → ECRS"},
  {title:"线平衡改善方向",content:"当平衡率低于85%时需要改善。方法：①拆分瓶颈工序到其他工位；②增加瓶颈工位人手/设备；③改善瓶颈工序作业方法；④合并时间短的相邻工序。目标：各工位时间趋近节拍。",formula:"平衡率 = ΣCT / (N × CT_max)"},
  {title:"看板数量计算",content:"看板系统的核心公式：<b>看板数量 = (日需求 × 前置时间 × 安全系数) / 容器容量</b>。安全系数取决于需求波动和供应稳定性，通常1.0-1.5。看板过多=库存浪费，过少=缺料风险。",formula:"K = (D × L × α) / C"},
  {title:"FMEA风险优先",content:"对每个潜在失效模式评估三个维度：严重度(S)、发生度(O)、探测度(D)，各1-10分。<b>RPN = S × O × D</b>。RPN>100需优先改善，改善时优先降低发生度和提高探测能力。",formula:"RPN = S × O × D"},
  {title:"Poka-Yoke防错三原理",content:"①<b>接触式</b>：通过形状/尺寸识别（如USB防反插）；②<b>固定值式</b>：必须完成规定数量才能进入下一步；③<b>动作步骤式</b>：必须按顺序操作才能完成。防错优于检验。",formula:"防错 > 检验"},
  {title:"价值流图分析",content:"VSM画出从原材料到客户的全流程，标注每个环节的CT、换模时间、良率、WIP等数据。<b>增值比 = 增值时间 / 总前置时间</b>。通常<5%，大量时间花在等待和搬运上。",formula:"增值比 = 增值时间 / 总前置时间"},
  {title:"TOC五步聚焦法",content:"①找出瓶颈；②挖掘瓶颈潜能；③让非瓶颈配合瓶颈；④突破瓶颈；⑤回到第一步找新瓶颈。系统产出由瓶颈决定，非瓶颈的改善不会增加产出。",formula:"产出 ≤ 瓶颈速率"},
  {title:"MOD法基础",content:"模特排时法以手指移动2.5cm为1MOD（0.129秒）。基本动作：移动(M1-M5)、抓取(G0-G3)、放置(P0-P5)等。比秒表法更客观，不需要现场观测，适合新产品工时预估。",formula:"1 MOD = 0.129s"},
  {title:"宽放率设定",content:"标准工时中的宽放不是随意加的。私事宽放5%（上厕所喝水）；疲劳宽放视作业强度5-20%（重体力取高值）；延迟宽放3-5%（物料等待、设备调整）。总宽放一般13-25%。",formula:"宽放 = 私事 + 疲劳 + 延迟"},
  {title:"甘特图与关键路径",content:"项目管理中，<b>关键路径</b>是耗时最长的任务链，决定了项目最短工期。非关键路径有浮动时间。IE改善项目要重点关注关键路径上的任务，缩短它们才能缩短总工期。",formula:"项目工期 = 关键路径长度"},
  {title:"5S是改善起点",content:"5S不是大扫除，而是管理基础。通过整理减少障碍物→整顿减少寻找时间→清扫发现异常→清洁标准化→素养养成习惯。5S做不好的现场，IE改善方案也难以落地。",formula:"5S → 标准化 → 改善"},
  {title:"动作经济22原则精要",content:"①双手同时动作且反向对称；②动作距离最短；③减少动作等级（手指>手腕>前臂>上臂）；④利用重力/惯性/弹力；⑤物料工具定点定量；⑥利用夹具/导轨定位。核心：省力省时省空间。",formula:"减少动作等级 = 降低疲劳"},
  {title:"人机料法环测",content:"遇到任何异常先按<b>4M1E</b>分层：人（技能/疲劳）、机（设备状态）、料（批次）、法（SOP参数）、环（温湿度）、测（量具方法）。每层问一次'有数据证明吗'，避免拍脑袋归因。鱼骨图的六大分支就是它。",formula:"4M1E + 测 = 5M1E"},
  {title:"QC七大手法怎么选",content:"收集数据用<b>检查表</b>；分类对比用<b>层别法</b>；抓主要矛盾用<b>柏拉图</b>（80/20）；找根因用<b>鱼骨图</b>；看两变量关系用<b>散布图</b>；看分布形态用<b>直方图</b>；监控过程稳定性用<b>控制图</b>。口诀：查层柏、因散直控。",formula:"先层别 → 再柏拉图 → 后鱼骨图"},
  {title:"U型线为什么好",content:"①<b>进出口同侧</b>：一人完成首尾工序，减少走动；②<b>弹性应对产量波动</b>：需求降时一人多工序，需求升时增员分工；③<b>视野开阔</b>：整条线状态一目了然，便于互助和目视化。适合多品种小批量。",formula:"U型线 = 弹性 + 单件流"},

// ============ 渲染 ============
const catNames = {essential:"IE必学",abbr:"IE缩写库",formula:"公式手册",theory:"基础理论",soft:"软技能",job:"招聘技能地图",digital:"数字化技能"};
let currentCat = 'all';
let searchTerm = '';

function renderAbbr(list){
  return list.map(a=>`
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-abbr">${a.abbr}</div>
          <div class="card-full">${a.full}</div>
        </div>
        <span class="card-tag tag-${a.cat}">${a.cat}</span>
      </div>
      <div class="card-cn">${a.cn}</div>
      <div class="card-desc">${a.desc}</div>
      ${a.formula!=="无"?`<div class="card-formula">${a.formula}</div>`:''}
      ${a.example?`<div class="card-example">💡 ${a.example}</div>`:''}
    </div>
  `).join('');
}

function renderFormula(list){
  return list.map(f=>`
    <div class="card">
      <div class="card-head">
        <div class="card-abbr" style="font-size:15px">${f.name}</div>
        <span class="card-tag tag-${f.cat}">${f.cat}</span>
      </div>
      <div class="card-formula">${f.formula}</div>
      <div class="card-desc">${f.desc}</div>
      <div class="card-example">💡 ${f.example}</div>
    </div>
  `).join('');
}

function renderTheory(list){
  return list.map(t=>`
    <div class="theory-card">
      <h3>🎓 ${t.name}</h3>
      <div class="t-desc">${t.desc}</div>
      <ul>${t.points.map(p=>`<li>${p}</li>`).join('')}</ul>
    </div>
  `).join('');
}

function renderEssential(list){
  return list.map(t=>`
    <div class="theory-card">
      <h3>🧭 ${t.name}</h3>
      <div class="t-desc">${t.desc}</div>
      <ul>${t.points.map(p=>`<li>${p}</li>`).join('')}</ul>
    </div>
  `).join('');
}

function renderSoft(list){
  return list.map(s=>`
    <div class="soft-card">
      <h3>🤝 ${s.name}</h3>
      <div class="s-desc">${s.desc}</div>
      <div class="soft-tips">${s.tips.map(t=>`<span class="soft-tip">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function filterData(){
  const s = searchTerm.toLowerCase();
  const match = (text)=> !s || text.toLowerCase().includes(s);
  let html = '';
  
  const showEssential = currentCat==='all'||currentCat==='essential';
  const showAbbr = currentCat==='all'||currentCat==='abbr';
  const showFormula = currentCat==='all'||currentCat==='formula';
  const showTheory = currentCat==='all'||currentCat==='theory';
  const showSoft = currentCat==='all'||currentCat==='soft';
  const showJob = currentCat==='all'||currentCat==='job';
  const showDigital = currentCat==='all'||currentCat==='digital';

  if(showEssential){
    const list = ESSENTIAL.filter(t=>match(t.name)||match(t.desc)||t.points.some(p=>match(p)));
    if(list.length){
      html += `<div class="section-title">🧭 IE必学 <span class="count">${list.length}条</span></div>`;
      html += `<div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${renderEssential(list)}</div>`;
    }
  }
  if(showAbbr){
    const list = ABBR.filter(a=>match(a.abbr)||match(a.full)||match(a.cn)||match(a.desc)||match(a.cat));
    if(list.length){
      html += `<div class="section-title">🔤 IE缩写库 <span class="count">${list.length}条</span></div>`;
      html += `<div class="card-grid">${renderAbbr(list)}</div>`;
    }
  }
  if(showFormula){
    const list = FORMULA.filter(f=>match(f.name)||match(f.formula)||match(f.desc)||match(f.cat));
    if(list.length){
      html += `<div class="section-title">📐 公式手册 <span class="count">${list.length}条</span></div>`;
      html += `<div class="card-grid">${renderFormula(list)}</div>`;
    }
  }
  if(showTheory){
    const list = THEORY.filter(t=>match(t.name)||match(t.desc)||t.points.some(p=>match(p)));
    if(list.length){
      html += `<div class="section-title">🎓 基础理论 <span class="count">${list.length}条</span></div>`;
      html += `<div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${renderTheory(list)}</div>`;
    }
  }
  if(showJob){
    const list = JOB.filter(t=>match(t.name)||match(t.desc)||t.points.some(p=>match(p)));
    if(list.length){
      html += `<div class="section-title">💼 招聘技能地图 <span class="count">${list.length}条</span></div>`;
      html += `<div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${renderEssential(list)}</div>`;
    }
  }
  if(showDigital){
    const list = DIGITAL.filter(t=>match(t.name)||match(t.desc)||t.points.some(p=>match(p)));
    if(list.length){
      html += `<div class="section-title">🖥️ 数字化技能 <span class="count">${list.length}条</span></div>`;
      html += `<div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${renderEssential(list)}</div>`;
    }
  }
  if(showSoft){
    const list = SOFT.filter(s=>match(s.name)||match(s.desc)||s.tips.some(t=>match(t)));
    if(list.length){
      html += `<div class="section-title">🤝 软技能 <span class="count">${list.length}条</span></div>`;
      html += `<div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${renderSoft(list)}</div>`;
    }
  }
  if(!html) html = '<div class="no-result">😕 没有找到匹配的内容，试试其他关键词？</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// 每日一学
let dailyIdx = 0;
function getDailyIdx(){
  const start = new Date(2024,0,1);
  const today = new Date();
  const days = Math.floor((today-start)/(86400000));
  return days % DAILY.length;
}
function renderDaily(idx){
  const d = DAILY[idx];
  document.getElementById('dailyBox').innerHTML = `
    <div class="daily-label">📖 每日一学 · 第${idx+1}期 / 共${DAILY.length}期</div>
    <div class="daily-title">${d.title}</div>
    <div class="daily-content">${d.content}</div>
    ${d.formula?`<div class="daily-formula">${d.formula}</div>`:''}
    <div class="daily-nav">
      <button onclick="dailyNav(-1)">◀ 上一期</button>
      <button onclick="dailyNav(1)">下一期 ▶</button>
      <button onclick="dailyNav(0)">🔄 今日推荐</button>
    </div>
  `;
}
function dailyNav(dir){
  if(dir===0) dailyIdx = getDailyIdx();
  else dailyIdx = (dailyIdx + dir + DAILY.length) % DAILY.length;
  renderDaily(dailyIdx);
  document.getElementById('dailyBox').scrollIntoView({behavior:'smooth',block:'nearest'});
}

// 日期
function showDate(){
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('todayDate').textContent = 
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${w}`;
}

// 事件绑定
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    filterData();
  });
});
document.getElementById('searchBox').addEventListener('input',e=>{
  searchTerm = e.target.value.trim();
  filterData();
});

// 初始化
showDate();
dailyIdx = getDailyIdx();
renderDaily(dailyIdx);
filterData();
</script>
