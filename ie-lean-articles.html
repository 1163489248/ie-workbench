<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IE精益知识工作台 | 185篇专业文章合集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card-hover: #232733;
  --border: #2d3142;
  --text: #e4e6eb;
  --text-dim: #8b8f9a;
  --accent: #4a9eff;
  --accent-dim: #2a6db5;
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff453a;
  --purple: #bf5af2;
  --pink: #ff375f;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
  border-bottom: 1px solid var(--border);
  padding: 20px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 1200px;
  margin: 0 auto;
}
.header h1 {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, #4a9eff, #bf5af2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-sub {
  color: var(--text-dim);
  font-size: 12px;
  margin-top: 2px;
}
.stats-bar {
  display: flex;
  gap: 16px;
  font-size: 12px;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--text-dim);
}
.stat-item .num {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}
.stat-item.read .num { color: var(--green); }
.stat-item.fav .num { color: var(--orange); }

/* Controls */
.controls {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px 24px 0;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-box input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px 10px 36px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--text-dim); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 14px;
}

/* Category Tabs */
.cat-tabs {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.cat-tab {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-dim);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.cat-tab:hover { background: var(--card-hover); color: var(--text); }
.cat-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.cat-tab .count {
  font-size: 11px;
  background: rgba(255,255,255,0.15);
  padding: 1px 6px;
  border-radius: 4px;
}
.cat-tab.active .count { background: rgba(255,255,255,0.25); }

/* Filter chips */
.filter-row {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px 8px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filter-chip {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 6px;
  cursor: pointer;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  transition: all 0.2s;
}
.filter-chip:hover { border-color: var(--accent); color: var(--text); }
.filter-chip.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: #fff;
}

/* Article List */
.article-list {
  max-width: 1200px;
  margin: 0 auto;
  padding: 8px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.article-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.15s;
  cursor: pointer;
}
.article-card:hover {
  background: var(--card-hover);
  border-color: var(--accent-dim);
}
.article-card.read {
  opacity: 0.55;
}
.article-card.read .article-title {
  text-decoration: line-through;
  text-decoration-color: var(--text-dim);
}
.article-num {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-dim);
  min-width: 32px;
  text-align: center;
}
.article-cat-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  white-space: nowrap;
  font-weight: 600;
}
.cat-01 { background: rgba(74,158,255,0.15); color: #4a9eff; }
.cat-02 { background: rgba(52,199,89,0.15); color: #34c759; }
.cat-03 { background: rgba(255,149,0,0.15); color: #ff9500; }
.cat-04 { background: rgba(191,90,242,0.15); color: #bf5af2; }
.cat-05 { background: rgba(255,69,58,0.15); color: #ff453a; }

.article-title {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  text-decoration: none;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.article-title:hover { color: var(--accent); }

.article-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.action-btn {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  color: var(--text-dim);
}
.action-btn:hover { background: var(--border); }
.action-btn.fav-active { color: var(--orange); }
.action-btn.read-active { color: var(--green); }

/* Category Section Headers */
.cat-header {
  max-width: 1200px;
  margin: 16px auto 4px;
  padding: 12px 24px 6px;
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}
.cat-header .cat-icon {
  font-size: 20px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}

/* Footer */
.footer {
  text-align: center;
  padding: 20px;
  color: var(--text-dim);
  font-size: 12px;
  border-top: 1px solid var(--border);
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3f52; }

/* Responsive */
@media (max-width: 600px) {
  .header-top { flex-direction: column; align-items: flex-start; }
  .article-card { flex-wrap: wrap; }
  .article-title { white-space: normal; width: 100%; order: 3; }
}
</style>
</head>

function selectCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.cat-tab[data-cat="' + cat + '"]').classList.add('active');
  renderArticles();
}

function selectFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  document.querySelector('.filter-chip[data-filter="' + filter + '"]').classList.add('active');
  renderArticles();
}

function filterArticles() {
  searchQuery = document.getElementById('search').value.toLowerCase();
  renderArticles();
}

function toggleRead(idx) {
  event.stopPropagation();
  const key = String(idx);
  readState[key] = !readState[key];
  if (!readState[key]) delete readState[key];
  localStorage.setItem('ie_read_state', JSON.stringify(readState));
  renderArticles();
  updateStats();
}

function toggleFav(idx) {
  event.stopPropagation();
  const key = String(idx);
  favState[key] = !favState[key];
  if (!favState[key]) delete favState[key];
  localStorage.setItem('ie_fav_state', JSON.stringify(favState));
  renderArticles();
  updateStats();
}

function updateStats() {
  const readCount = Object.keys(readState).length;
  const favCount = Object.keys(favState).length;
  document.getElementById('stat-read').textContent = readCount;
  document.getElementById('stat-fav').textContent = favCount;
}

function renderArticles() {
  const list = document.getElementById('article-list');
  let filtered = articles.filter((a, i) => {
    // Category filter
    if (currentCat !== 'all' && a.cat !== currentCat) return false;
    // Search filter
    if (searchQuery && !a.title.toLowerCase().includes(searchQuery)) return false;
    // Status filter
    const idx = String(i);
    if (currentFilter === 'read' && !readState[idx]) return false;
    if (currentFilter === 'unread' && readState[idx]) return false;
    if (currentFilter === 'fav' && !favState[idx]) return false;
    if (currentFilter === 'pdf' && !a.title.includes('PDF') && !a.title.includes('PPT')) return false;
    return true;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state">📭 没有找到匹配的文章</div>';
    return;
  }

  // Group by category if showing all
  let html = '';
  if (currentCat === 'all') {
    const catNames = {'01':'🔧 工业工程','02':'⚡ 精益生产','03':'🏭 工厂规划','04':'👁 目视化管理/5S','05':'🤖 智能制造/质量/班组'};
    let lastCat = '';
    filtered.forEach((a) => {
      const origIdx = articles.indexOf(a);
      if (a.cat !== lastCat) {
        lastCat = a.cat;
        html += '<div class="cat-header"><span class="cat-icon">' + catNames[a.cat].split(' ')[0] + '</span>' + catNames[a.cat].substring(2) + '</div>';
      }
      html += renderCard(a, origIdx);
    });
  } else {
    filtered.forEach((a) => {
      const origIdx = articles.indexOf(a);
      html += renderCard(a, origIdx);
    });
  }

  list.innerHTML = html;
}

function renderCard(a, idx) {
  const isRead = readState[String(idx)];
  const isFav = favState[String(idx)];
  const hasResource = a.title.includes('PDF') || a.title.includes('PPT');
  return '<div class="article-card' + (isRead ? ' read' : '') + '" onclick="window.open(\''+a.url+'\', \'_blank\')">' +
    '<span class="article-num">' + (idx + 1) + '</span>' +
    '<span class="article-cat-tag cat-' + a.cat + '">' + a.catName + '</span>' +
    '<a class="article-title" href="' + a.url + '" target="_blank" onclick="event.stopPropagation()">' + a.title + '</a>' +
    (hasResource ? '<span style="font-size:11px;color:var(--orange);">📎</span>' : '') +
    '<div class="article-actions">' +
      '<button class="action-btn' + (isFav ? ' fav-active' : '') + '" onclick="toggleFav(' + idx + ')" title="收藏">' + (isFav ? '⭐' : '☆') + '</button>' +
      '<button class="action-btn' + (isRead ? ' read-active' : '') + '" onclick="toggleRead(' + idx + ')" title="标记已读">' + (isRead ? '✅' : '○') + '</button>' +
    '</div>' +
  '</div>';
}

// Init
updateStats();
renderArticles();
</script>
</body>
</html>
